name: CI build

on: push

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - macos-14
          - windows-2019
          - windows-2022

    steps:
      - uses: actions/checkout@v3
      - uses: ilammy/setup-nasm@v1
      - run: git fetch --prune --unshallow

      - name: Build
        run: |
          mkdir build
          cd build
          cmake -DENABLE_TEST=1 ..
          cmake --build .

      - name: Unit test
        run: |
          cd build/source/lib/test
          ctest
